<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人資產管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <style>
    .tab-active { color: #34d399; border-color: #10b981; background: rgba(16,185,129,0.12); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">個人資產管理</h1>
        <p class="text-xs text-slate-500">GitHub Pages + Supabase</p>
      </div>
      <div id="user-area" class="text-sm text-slate-400"></div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- Auth -->
    <section id="auth-section" class="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-4">
      <h2 class="text-lg font-semibold text-center text-emerald-400">登入 / 註冊</h2>
      <input id="email" type="email" placeholder="Email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" />
      <input id="password" type="password" placeholder="密碼（至少6碼）" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" />
      <div class="flex gap-3">
        <button onclick="doLogin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 text-sm font-medium">登入</button>
        <button onclick="doSignup()" class="flex-1 bg-slate-700 hover:bg-slate-600 rounded-xl py-2.5 text-sm">註冊</button>
      </div>
      <button onclick="doReset()" class="w-full text-xs text-slate-500 hover:text-emerald-400">忘記密碼</button>
      <p id="auth-msg" class="text-xs text-center hidden"></p>
    </section>

    <!-- 重設密碼區塊 -->
    <section id="recovery-section" class="hidden max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-4">
      <h2 class="text-lg font-semibold text-center text-emerald-400">設定新密碼</h2>
      <input id="new-password" type="password" placeholder="新密碼（至少6碼）" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" />
      <input id="confirm-password" type="password" placeholder="再次確認新密碼" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" />
      <button onclick="updatePassword()" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 text-sm font-medium">確認更新密碼</button>
      <p id="recovery-msg" class="text-xs text-center hidden"></p>
    </section>

    <!-- App -->
    <div id="app" class="hidden space-y-6">
      <nav class="flex flex-wrap gap-2 text-sm">
        <button data-tab="dashboard" class="tab-btn tab-active px-4 py-2 rounded-xl border border-slate-700">總覽</button>
        <button data-tab="assets" class="tab-btn px-4 py-2 rounded-xl border border-transparent text-slate-400">資產</button>
        <button data-tab="accounts" class="tab-btn px-4 py-2 rounded-xl border border-transparent text-slate-400">帳戶</button>
        <button data-tab="tx" class="tab-btn px-4 py-2 rounded-xl border border-transparent text-slate-400">收支</button>
      </nav>

      <!-- Dashboard -->
      <section id="tab-dashboard" class="space-y-4">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4">
            <div class="text-xs text-slate-500">總資產 (TWD)</div>
            <div id="stat-total" class="text-xl font-bold text-emerald-400 mt-1">—</div>
          </div>
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4">
            <div class="text-xs text-slate-500">股票 / ETF</div>
            <div id="stat-stock" class="text-xl font-bold mt-1">—</div>
          </div>
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4">
            <div class="text-xs text-slate-500">現金</div>
            <div id="stat-cash" class="text-xl font-bold mt-1">—</div>
          </div>
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4">
            <div class="text-xs text-slate-500">匯率 USD / JPY</div>
            <div class="text-sm mt-1"><span id="rate-usd">—</span> / <span id="rate-jpy">—</span></div>
          </div>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4">
          <canvas id="pieChart" height="180"></canvas>
        </div>
      </section>

      <!-- Assets -->
      <section id="tab-assets" class="hidden space-y-4">
        <div class="flex flex-wrap gap-2 items-center justify-between">
          <div class="flex gap-2">
            <button onclick="openBuyModal()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-sm">＋ 新增資產</button>
            <button onclick="refreshAllPrices()" id="btn-refresh-price" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm">重新抓價</button>
          </div>
          <button onclick="exportAssets()" class="text-xs text-slate-400 hover:text-emerald-400">匯出 CSV</button>
        </div>
        <div class="overflow-x-auto bg-slate-800 border border-slate-700 rounded-2xl">
          <table class="w-full text-sm">
            <thead class="text-slate-500 border-b border-slate-700">
              <tr>
                <th class="text-left p-3">名稱</th>
                <th class="text-left p-3">帳戶</th>
                <th class="text-right p-3">數量</th>
                <th class="text-right p-3">價格</th>
                <th class="text-right p-3">台幣估值</th>
                <th class="text-right p-3">操作</th>
              </tr>
            </thead>
            <tbody id="asset-body"></tbody>
          </table>
        </div>
      </section>

      <!-- Accounts -->
      <section id="tab-accounts" class="hidden space-y-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3">
          <div class="flex flex-wrap gap-2">
            <input id="new-account-name" placeholder="帳戶名稱（例如：永豐複委託、中信存款）" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm flex-1 min-w-[200px]" />
            <select id="new-account-type" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">
              <option value="stock">股票帳戶</option>
              <option value="cash">存款帳戶</option>
            </select>
            <button onclick="addAccount()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-sm">新增帳戶</button>
          </div>
          <p class="text-xs text-slate-500">新增時就要選擇類型，之後新增資產會自動對應</p>
        </div>
        <div id="account-list" class="grid sm:grid-cols-2 gap-3"></div>
      </section>

      <!-- Transactions -->
      <section id="tab-tx" class="hidden space-y-4">
        <form onsubmit="addTransaction(event)" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 grid sm:grid-cols-2 gap-3 text-sm">
          <select id="tx-type" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
            <option value="income">收入</option>
            <option value="expense">支出</option>
            <option value="realize">變現</option>
          </select>
          <input id="tx-category" placeholder="說明 / 分類" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2" />
          <input id="tx-amount" type="number" step="0.01" placeholder="金額" required class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2" />
          <input id="tx-date" type="date" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2" />
          <select id="tx-cash-account" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 sm:col-span-2">
            <option value="">不連動現金帳戶</option>
          </select>
          <button class="sm:col-span-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5">紀錄並更新</button>
        </form>
        <div id="tx-list" class="space-y-2 text-sm"></div>
      </section>
    </div>
  </main>

  <!-- 新增 / 編輯資產 Modal -->
  <div id="asset-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-5 space-y-3">
      <h3 id="modal-title" class="text-lg font-semibold text-emerald-400">新增資產</h3>
      
      <div>
        <label class="text-xs text-slate-400">類型</label>
        <select id="asset-type" onchange="onTypeChange()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm mt-1">
          <option value="stock">股票 / ETF</option>
          <option value="cash">現金 / 存款</option>
          <option value="other">其他</option>
        </select>
      </div>

      <input id="asset-symbol" placeholder="股票代碼（現金可留空）" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm" />
      <input id="asset-name" placeholder="名稱" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm" />

      <div class="grid grid-cols-2 gap-2">
        <input id="asset-qty" type="number" step="any" placeholder="數量 / 金額" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm" />
        <input id="asset-price" type="number" step="any" placeholder="單價（現金填1）" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm" />
      </div>

      <select id="asset-currency" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">
        <option value="TWD">TWD</option>
        <option value="USD">USD</option>
        <option value="JPY">JPY</option>
      </select>

      <div>
        <label class="text-xs text-slate-400">放入哪個帳戶</label>
        <select id="asset-account" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm mt-1"></select>
      </div>

      <div id="deduct-area" class="space-y-2">
        <label class="flex items-center gap-2 text-sm text-slate-400">
          <input id="asset-deduct" type="checkbox" class="rounded" />
          同時從存款帳戶扣除（買股票時用）
        </label>
        <select id="asset-deduct-from" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm"></select>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeAssetModal()" class="flex-1 bg-slate-700 rounded-xl py-2">取消</button>
        <button onclick="submitAsset()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2">確認</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zsrnxfluhqjseltmgimm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ix_4ZSypiUVpMxdDzE8Frg___QsGMfO';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let user = null;
    let assets = [];
    let accounts = [];
    let transactions = [];
    let usdRate = 32;
    let jpyRate = 0.21;
    let pieChart = null;
    let editingId = null;
    const priceCache = {};

    async function init() {
      document.getElementById('tx-date').value = new Date().toISOString().slice(0,10);

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      // 處理密碼重設
      sb.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('app').classList.add('hidden');
          document.getElementById('recovery-section').classList.remove('hidden');
          return;
        }
        user = session?.user || null;
        if (user) {
          showApp();
          await loadAll();
        } else {
          document.getElementById('auth-section').classList.remove('hidden');
          document.getElementById('app').classList.add('hidden');
          document.getElementById('recovery-section').classList.add('hidden');
        }
      });

      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        user = session.user;
        showApp();
        await loadAll();
      }

      loadRates();
    }

    function showApp() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('recovery-section').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('user-area').innerHTML = `
        <span class="mr-3">${user.email}</span>
        <button onclick="sb.auth.signOut()" class="text-rose-400 hover:underline text-xs">登出</button>
      `;
    }

    function switchTab(name) {
      ['dashboard','assets','accounts','tx'].forEach(t => {
        document.getElementById('tab-'+t).classList.toggle('hidden', t !== name);
      });
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('tab-active', b.dataset.tab === name);
        b.classList.toggle('text-slate-400', b.dataset.tab !== name);
      });
    }

    // Auth
    function showAuthMsg(error, okMsg) {
      const el = document.getElementById('auth-msg');
      el.classList.remove('hidden');
      el.textContent = error ? (error.message || error) : okMsg;
      el.className = 'text-xs text-center ' + (error ? 'text-rose-400' : 'text-emerald-400');
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showAuthMsg({message:'請輸入 Email 和密碼'});
      const { error } = await sb.auth.signInWithPassword({ email, password });
      showAuthMsg(error);
    }

    async function doSignup() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showAuthMsg({message:'請輸入 Email 和密碼'});
      if (password.length < 6) return showAuthMsg({message:'密碼至少需要 6 個字元'});
      const { error } = await sb.auth.signUp({ email, password });
      showAuthMsg(error, error ? null : '註冊成功，請直接嘗試登入');
    }

    async function doReset() {
      const email = document.getElementById('email').value.trim();
      if (!email) return showAuthMsg({message:'請先輸入 Email'});
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
      showAuthMsg(error, error ? null : '重設信已寄出，請檢查信箱');
    }

    async function updatePassword() {
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;
      const msg = document.getElementById('recovery-msg');
      if (p1.length < 6) {
        msg.textContent = '密碼至少 6 碼';
        msg.className = 'text-xs text-center text-rose-400';
        msg.classList.remove('hidden');
        return;
      }
      if (p1 !== p2) {
        msg.textContent = '兩次密碼不一致';
        msg.className = 'text-xs text-center text-rose-400';
        msg.classList.remove('hidden');
        return;
      }
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) {
        msg.textContent = error.message;
        msg.className = 'text-xs text-center text-rose-400';
      } else {
        msg.textContent = '密碼更新成功！即將進入系統...';
        msg.className = 'text-xs text-center text-emerald-400';
        setTimeout(() => location.reload(), 1500);
      }
      msg.classList.remove('hidden');
    }

    // Data
    async function loadAll() {
      await Promise.all([loadAccounts(), loadAssets(), loadTransactions()]);
      renderAll();
    }

    async function loadAccounts() {
      const { data } = await sb.from('accounts').select('*').eq('user_id', user.id).order('name');
      accounts = data || [];
    }

    async function loadAssets() {
      const { data } = await sb.from('assets').select('*').eq('user_id', user.id);
      assets = data || [];
      refreshAllPrices(true);
    }

    async function loadTransactions() {
      const { data } = await sb.from('transactions').select('*').eq('user_id', user.id).order('date', {ascending:false});
      transactions = data || [];
    }

    async function loadRates() {
      try {
        const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        const json = await res.json();
        if (json?.rates?.TWD) usdRate = json.rates.TWD;
        if (json?.rates?.JPY) jpyRate = json.rates.TWD / json.rates.JPY;
      } catch(e) {}
      document.getElementById('rate-usd').textContent = usdRate.toFixed(2);
      document.getElementById('rate-jpy').textContent = jpyRate.toFixed(4);
    }

    // Price
    async function fetchPrice(symbol) {
      if (!symbol) return null;
      const key = symbol.toUpperCase().trim();
      const cache = priceCache[key];
      if (cache && Date.now() - cache.updatedAt < 5*60*1000) return cache;

      let price = null, prevClose = null;
      try {
        let ticker = key.toLowerCase();
        if (!ticker.includes('.')) ticker += '.us';
        if (key.endsWith('.T') || key.endsWith('.JP')) ticker = key.split('.')[0].toLowerCase() + '.jp';
        const res = await fetch(`https://stooq.com/q/l/?s=${ticker}&f=sd2t2ohlcv&h&e=json`);
        const data = await res.json();
        const row = data?.symbols?.[0];
        if (row) {
          price = parseFloat(row.close);
          prevClose = parseFloat(row.previous || row.close);
        }
      } catch(e) {}

      if ((!price || isNaN(price)) && prevClose && !isNaN(prevClose)) price = prevClose;

      const result = {
        price: price && !isNaN(price) ? price : null,
        isPrev: !price || (prevClose && Math.abs(price - prevClose) < 0.0001),
        updatedAt: Date.now()
      };
      priceCache[key] = result;
      return result;
    }

    async function refreshAllPrices(silent=false) {
      const btn = document.getElementById('btn-refresh-price');
      if (!silent && btn) { btn.disabled = true; btn.textContent = '更新中...'; }

      const list = assets.filter(a => a.type === 'stock' && a.symbol);
      await Promise.all(list.map(async a => {
        const r = await fetchPrice(a.symbol);
        if (r?.price) { a.price = r.price; a._priceIsPrev = r.isPrev; }
      }));

      renderAssets();
      renderDashboard();
      if (!silent && btn) { btn.disabled = false; btn.textContent = '重新抓價'; }
    }

    // Render
    function renderAll() {
      renderAccounts();
      renderAssets();
      renderTransactions();
      renderDashboard();
      fillSelects();
    }

    function toTWD(a) {
      let rate = 1;
      if (a.currency === 'USD') rate = usdRate;
      else if (a.currency === 'JPY') rate = jpyRate;
      return (a.qty||0) * (a.price||0) * rate;
    }

    function renderDashboard() {
      let total=0, stock=0, cash=0;
      assets.forEach(a => {
        const v = toTWD(a);
        total += v;
        if (a.type === 'stock') stock += v;
        if (a.type === 'cash') cash += v;
      });
      document.getElementById('stat-total').textContent = 'NT$ ' + Math.round(total).toLocaleString();
      document.getElementById('stat-stock').textContent = 'NT$ ' + Math.round(stock).toLocaleString();
      document.getElementById('stat-cash').textContent = 'NT$ ' + Math.round(cash).toLocaleString();

      const ctx = document.getElementById('pieChart');
      if (pieChart) pieChart.destroy();
      pieChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['股票/ETF','現金','其他'],
          datasets: [{ data: [stock, cash, Math.max(0,total-stock-cash)], backgroundColor: ['#34d399','#60a5fa','#a78bfa'] }]
        },
        options: { plugins: { legend: { labels: { color: '#94a3b8' } } } }
      });
    }

    function renderAssets() {
      const body = document.getElementById('asset-body');
      if (!assets.length) {
        body.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">尚無資產，請先新增帳戶再新增資產</td></tr>`;
        return;
      }
      body.innerHTML = assets.map(a => {
        const twd = Math.round(toTWD(a));
        const note = a._priceIsPrev ? '<span class="text-[10px] text-amber-400 ml-1">前收</span>' : '';
        return `<tr class="border-b border-slate-700/50 hover:bg-slate-700/20">
          <td class="p-3">
            <div class="font-medium">${a.name || a.symbol || '—'}</div>
            <div class="text-xs text-slate-500">${a.symbol||''} · ${a.type==='stock'?'股票':a.type==='cash'?'現金':'其他'}</div>
          </td>
          <td class="p-3 text-slate-400">${a.account_name || '—'}</td>
          <td class="p-3 text-right font-mono">${a.qty}</td>
          <td class="p-3 text-right font-mono">${(a.price||0).toLocaleString()}${note}<div class="text-[10px] text-slate-500">${a.currency}</div></td>
          <td class="p-3 text-right font-mono text-emerald-400">${twd.toLocaleString()}</td>
          <td class="p-3 text-right space-x-2">
            <button onclick="editAsset('${a.id}')" class="text-xs text-sky-400 hover:underline">編輯</button>
            <button onclick="deleteAsset('${a.id}')" class="text-xs text-rose-400 hover:underline">刪除</button>
          </td>
        </tr>`;
      }).join('');
    }

    function renderAccounts() {
      const el = document.getElementById('account-list');
      if (!accounts.length) {
        el.innerHTML = `<div class="text-slate-500 text-sm col-span-2">尚未建立帳戶，請先新增「股票帳戶」或「存款帳戶」</div>`;
        return;
      }
      el.innerHTML = accounts.map(a => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex justify-between items-center">
          <div>
            <div class="font-medium">${a.name}</div>
            <div class="text-xs text-slate-500">${a.type === 'cash' ? '存款帳戶' : '股票帳戶'}</div>
          </div>
          <button onclick="deleteAccount('${a.id}')" class="text-xs text-rose-400">刪除</button>
        </div>
      `).join('');
    }

    function renderTransactions() {
      const el = document.getElementById('tx-list');
      if (!transactions.length) {
        el.innerHTML = `<div class="text-slate-500 text-sm">尚無收支紀錄</div>`;
        return;
      }
      el.innerHTML = transactions.slice(0,30).map(t => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex justify-between text-sm">
          <div>
            <div class="font-medium">${t.category}</div>
            <div class="text-xs text-slate-500">${t.date} · ${t.type}</div>
          </div>
          <div class="font-mono ${t.type==='expense'?'text-rose-400':'text-emerald-400'}">
            ${t.type==='expense'?'-':'+'}${Number(t.amount).toLocaleString()}
          </div>
        </div>
      `).join('');
    }

    function fillSelects() {
      const type = document.getElementById('asset-type')?.value || 'stock';
      const filtered = accounts.filter(a => {
        if (type === 'cash') return a.type === 'cash';
        if (type === 'stock') return a.type === 'stock' || !a.type;
        return true;
      });
      const accOpts = filtered.map(a => `<option value="${a.name}">${a.name}</option>`).join('');
      const cashAccounts = accounts.filter(a => a.type === 'cash');
      const cashOpts = cashAccounts.map(a => {
        const cashAsset = assets.find(x => x.type==='cash' && x.account_name === a.name);
        const bal = cashAsset ? cashAsset.qty : 0;
        return `<option value="${a.name}">${a.name}（餘額約 ${bal}）</option>`;
      }).join('');

      const accountSelect = document.getElementById('asset-account');
      if (accountSelect) {
        accountSelect.innerHTML = filtered.length
          ? accOpts
          : `<option value="">請先到「帳戶」新增對應類型的帳戶</option>`;
      }

      const deductSelect = document.getElementById('asset-deduct-from');
      if (deductSelect) {
        deductSelect.innerHTML = `<option value="">選擇要扣除的存款帳戶</option>` + cashOpts;
      }

      const txSelect = document.getElementById('tx-cash-account');
      if (txSelect) {
        txSelect.innerHTML = `<option value="">不連動現金帳戶</option>` + 
          assets.filter(a => a.type==='cash').map(a => 
            `<option value="${a.id}">${a.account_name || a.name} (${a.qty} ${a.currency})</option>`
          ).join('');
      }
    }

    function onTypeChange() {
      fillSelects();
      const type = document.getElementById('asset-type').value;
      document.getElementById('deduct-area').style.display = type === 'stock' ? 'block' : 'none';
      if (type === 'cash') {
        document.getElementById('asset-price').value = 1;
      }
    }

    // Account
    async function addAccount() {
      const name = document.getElementById('new-account-name').value.trim();
      const type = document.getElementById('new-account-type').value;
      if (!name) return alert('請輸入帳戶名稱');
      await sb.from('accounts').insert([{ user_id: user.id, name, type }]);
      document.getElementById('new-account-name').value = '';
      await loadAccounts();
      renderAccounts();
      fillSelects();
    }

    async function deleteAccount(id) {
      if (!confirm('確定刪除帳戶？')) return;
      await sb.from('accounts').delete().eq('id', id);
      await loadAccounts();
      renderAccounts();
      fillSelects();
    }

    // Asset Modal
    function openBuyModal() {
      editingId = null;
      document.getElementById('modal-title').textContent = '新增資產';
      document.getElementById('asset-type').value = 'stock';
      document.getElementById('asset-symbol').value = '';
      document.getElementById('asset-name').value = '';
      document.getElementById('asset-qty').value = '';
      document.getElementById('asset-price').value = '';
      document.getElementById('asset-currency').value = 'TWD';
      document.getElementById('asset-deduct').checked = false;
      onTypeChange();
      document.getElementById('asset-modal').classList.remove('hidden');
    }

    function editAsset(id) {
      const a = assets.find(x => x.id === id);
      if (!a) return;
      editingId = id;
      document.getElementById('modal-title').textContent = '編輯資產';
      document.getElementById('asset-type').value = a.type || 'stock';
      document.getElementById('asset-symbol').value = a.symbol || '';
      document.getElementById('asset-name').value = a.name || '';
      document.getElementById('asset-qty').value = a.qty;
      document.getElementById('asset-price').value = a.price;
      document.getElementById('asset-currency').value = a.currency || 'TWD';
      onTypeChange();
      setTimeout(() => {
        document.getElementById('asset-account').value = a.account_name || '';
      }, 50);
      document.getElementById('asset-modal').classList.remove('hidden');
    }

    function closeAssetModal() {
      document.getElementById('asset-modal').classList.add('hidden');
      editingId = null;
    }

    async function submitAsset() {
      const type = document.getElementById('asset-type').value;
      const symbol = document.getElementById('asset-symbol').value.trim().toUpperCase();
      const name = document.getElementById('asset-name').value.trim() || symbol || '未命名';
      const qty = parseFloat(document.getElementById('asset-qty').value);
      let price = parseFloat(document.getElementById('asset-price').value);
      const currency = document.getElementById('asset-currency').value;
      const account_name = document.getElementById('asset-account').value;
      const deduct = document.getElementById('asset-deduct').checked;
      const deductFrom = document.getElementById('asset-deduct-from').value;

      if (!qty || qty <= 0) return alert('請填寫正確數量');
      if (isNaN(price) || price < 0) return alert('請填寫正確價格');
      if (!account_name) return alert('請選擇帳戶（若沒有選項，請先到「帳戶」新增）');

      if (type === 'cash') price = price || 1;

      if (editingId) {
        await sb.from('assets').update({
          type, symbol, name, qty, price, currency, account_name
        }).eq('id', editingId);
      } else {
        // 合併相同資產
        const existing = assets.find(a =>
          a.symbol === symbol && a.account_name === account_name && a.currency === currency && a.type === type
        );
        if (existing && type === 'stock') {
          const newQty = existing.qty + qty;
          await sb.from('assets').update({ qty: newQty, price }).eq('id', existing.id);
        } else {
          await sb.from('assets').insert([{
            user_id: user.id, type, symbol, name, account_name, qty, price, currency
          }]);
        }

        // 扣款
        if (deduct && deductFrom && type === 'stock') {
          const cashAsset = assets.find(a => a.type === 'cash' && a.account_name === deductFrom);
          if (cashAsset) {
            const cost = qty * price;
            const newQty = Math.max(0, cashAsset.qty - cost);
            await sb.from('assets').update({ qty: newQty }).eq('id', cashAsset.id);
            await sb.from('transactions').insert([{
              user_id: user.id, type: 'expense', category: `買進 ${name}`, amount: cost,
              date: new Date().toISOString().slice(0,10)
            }]);
          }
        }
      }

      closeAssetModal();
      await loadAll();
    }

    async function deleteAsset(id) {
      if (!confirm('確定刪除此資產？')) return;
      await sb.from('assets').delete().eq('id', id);
      await loadAssets();
      renderAssets();
      renderDashboard();
      fillSelects();
    }

    // Transaction
    async function addTransaction(e) {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      const category = document.getElementById('tx-category').value.trim();
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const date = document.getElementById('tx-date').value;
      const cashId = document.getElementById('tx-cash-account').value;

      await sb.from('transactions').insert([{ user_id: user.id, type, category, amount, date }]);

      if (cashId) {
        const cash = assets.find(a => a.id === cashId);
        if (cash) {
          let newQty = cash.qty;
          if (type === 'income' || type === 'realize') newQty += amount;
          else newQty = Math.max(0, newQty - amount);
          await sb.from('assets').update({ qty: newQty }).eq('id', cashId);
        }
      }

      e.target.reset();
      document.getElementById('tx-date').value = new Date().toISOString().slice(0,10);
      await loadAll();
    }

    function exportAssets() {
      let csv = '名稱,代碼,類型,帳戶,數量,價格,幣別,台幣估值\n';
      assets.forEach(a => {
        csv += `"${a.name}","${a.symbol||''}","${a.type}","${a.account_name||''}",${a.qty},${a.price},${a.currency},${Math.round(toTWD(a))}\n`;
      });
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `assets_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    init();
  </script>
</body>
</html>
