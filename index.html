<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人資產管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header Zone -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">💰 個人資產管理系統</h1>
        <p class="text-sm text-slate-400 mt-1">跨裝置連動 · 免金鑰自動抓價 · 月份收支明細追蹤</p>
      </div>
      <div id="auth-status-header" class="mt-4 md:mt-0"></div>
    </header>

    <!-- 登入 / 註冊 區塊 (未登入時顯示) -->
    <div id="auth-card" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg max-w-md mx-auto space-y-4">
      <h2 id="auth-title" class="text-xl font-bold text-emerald-400 text-center">🔑 帳號登入 / 註冊</h2>
      <form onsubmit="handleAuth(event)" class="space-y-4 text-sm">
        <div>
          <label class="block text-slate-400 mb-1">電子郵件 (Email)</label>
          <input type="email" id="auth-email" placeholder="your@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">密碼 (Password)</label>
          <input type="password" id="auth-password" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
        </div>
        <div class="flex gap-3">
          <button type="submit" id="btn-login" onclick="authMode='login'" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl transition">直接登入</button>
          <button type="submit" id="btn-signup" onclick="authMode='signup'" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 rounded-xl transition">註冊新帳號</button>
        </div>
      </form>
    </div>

    <!-- 主要內容區塊 (登入後顯示) -->
    <div id="main-app" class="hidden space-y-6">
      <!-- 總資產與匯率儀表板 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">總資產估值 (TWD)</span>
          <div id="total-assets" class="text-3xl font-extrabold text-emerald-400 mt-2">NT$ 0</div>
        </div>
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">美元 / 台幣匯率 (即時)</span>
          <div id="usd-rate" class="text-3xl font-extrabold text-blue-400 mt-2">載入中...</div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- 左側：Asset List (占 7 格) -->
        <div class="lg:col-span-7 bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
          <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <h2 class="text-xl font-bold text-slate-200">📊 個人資產清單</h2>
            <div class="flex gap-2">
              <button onclick="loadAssets()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-xl text-xs font-medium transition">🔄 重新抓價</button>
              <button onclick="toggleAssetModal(true)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition">+ 新增資產</button>
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-300">
              <thead class="text-xs uppercase bg-slate-700/50 text-slate-400">
                <tr>
                  <th class="p-3">名稱 / 代碼</th>
                  <th class="p-3">類別</th>
                  <th class="p-3">數量</th>
                  <th class="p-3">最新價格</th>
                  <th class="p-3">折算台幣</th>
                  <th class="p-3 text-center">操作</th>
                </tr>
              </thead>
              <tbody id="asset-table-body" class="divide-y divide-slate-700">
                <tr><td colspan="6" class="text-center p-6 text-slate-500">載入中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 右側：收支登記與月分明細 (占 5 格) -->
        <div class="lg:col-span-5 space-y-6">
          <!-- 快速收支登記表單 -->
          <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="text-xl font-bold text-slate-200 border-b border-slate-700 pb-4">💳 快速收支與變現登記</h2>
            <form id="tx-form" onsubmit="handleTransaction(event)" class="space-y-4 text-sm">
              <div>
                <label class="block text-slate-400 mb-1">交易類型</label>
                <select id="tx-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                  <option value="income">💵 收入 (Income)</option>
                  <option value="expense">💸 支出 (Expense)</option>
                  <option value="realize">🔄 資產變現/賣出 (Realize)</option>
                </select>
              </div>
              <div>
                <label class="block text-slate-400 mb-1">說明 / 分類</label>
                <input type="text" id="tx-category" placeholder="例如：薪資、美股賣出變現" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
              </div>
              <div>
                <label class="block text-slate-400 mb-1">金額 (TWD)</label>
                <input type="number" id="tx-amount" step="any" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
              </div>
              <div>
                <label class="block text-slate-400 mb-1">日期</label>
                <input type="date" id="tx-date" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
              </div>
              <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition">紀錄並更新</button>
            </form>
          </div>

          <!-- 收支歷史明細與月份篩選 -->
          <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-700 pb-3 gap-2">
              <h3 class="text-lg font-bold text-slate-200">📜 收支歷史明細</h3>
              <!-- 月份選擇器 -->
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">月份:</span>
                <select id="tx-month-filter" onchange="renderTransactions()" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg p-1.5">
                  <option value="all">全部紀錄</option>
                </select>
              </div>
            </div>

            <!-- 當月統計卡片 -->
            <div id="month-summary" class="grid grid-cols-3 gap-2 text-center text-xs bg-slate-900/40 p-2.5 rounded-xl border border-slate-700/40">
              <div><span class="text-slate-400 block">總收入</span><span id="sum-income" class="text-emerald-400 font-bold">NT$ 0</span></div>
              <div><span class="text-slate-400 block">總支出</span><span id="sum-expense" class="text-rose-400 font-bold">NT$ 0</span></div>
              <div><span class="text-slate-400 block">淨額</span><span id="sum-net" class="text-blue-400 font-bold">NT$ 0</span></div>
            </div>

            <div class="overflow-y-auto max-h-64 space-y-2 pr-1" id="tx-list">
              <div class="text-center p-4 text-slate-500 text-xs">載入紀錄中...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: 新增資產彈窗 -->
  <div id="asset-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-slate-100">➕ 新增資產項目</h3>
        <button onclick="toggleAssetModal(false)" class="text-slate-400 hover:text-slate-200">✕</button>
      </div>
      <form onsubmit="handleAddAsset(event)" class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-400 mb-1">資產名稱</label>
          <input type="text" id="new-asset-name" placeholder="例如：台幣活存、元大台灣50" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">資產類別</label>
          <select id="new-asset-type" onchange="toggleSymbolInput(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
            <option value="cash">💵 現金 / 存款</option>
            <option value="stock">📈 股票 / ETF</option>
            <option value="fund">🏦 基金 / 連結基金</option>
            <option value="gold">🏆 黃金 / 貴金屬</option>
            <option value="other">📦 其他</option>
          </select>
        </div>
        <div id="symbol-container" class="hidden">
          <label class="block text-slate-400 mb-1">股票代碼 (台股填數字如 0050，美股填 VOO)</label>
          <input type="text" id="new-asset-symbol" placeholder="例如：0050" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
        </div>
        <div>
          <label id="qty-label" class="block text-slate-400 mb-1">金額 / 數量</label>
          <input type="number" id="new-asset-qty" step="any" placeholder="現金填金額，股票填股數" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
        </div>
        <div id="price-container" class="hidden">
          <label class="block text-slate-400 mb-1">預設/備用單價</label>
          <input type="number" id="new-asset-price" step="any" value="1" placeholder="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">計價幣別</label>
          <select id="new-asset-currency" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
            <option value="TWD">新台幣 (TWD)</option>
            <option value="USD">美元 (USD)</option>
          </select>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="toggleAssetModal(false)" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-xl transition">取消</button>
          <button type="submit" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl transition">確定新增</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zsrnxfluhqjseltmgimm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ix_4ZSypiUVpMxdDzE8Frg___QsGMfO';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUsdRate = 32.26;
    let currentUser = null;
    let authMode = 'login';
    let rawTransactions = [];

    const typeMap = {
      'stock': '股票/ETF',
      'fund': '基金/連結基金',
      'cash': '現金/存款',
      'gold': '黃金/貴金屬',
      'other': '其他'
    };

    async function init() {
      document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];
      await fetchRates();
      const { data: { user } } = await supabaseClient.auth.getUser();
      currentUser = user;
      updateUI();
    }

    function updateUI() {
      const authCard = document.getElementById('auth-card');
      const mainApp = document.getElementById('main-app');
      const authStatusHeader = document.getElementById('auth-status-header');

      if (currentUser) {
        authCard.classList.add('hidden');
        mainApp.classList.remove('hidden');
        authStatusHeader.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-sm text-slate-300">👤 ${currentUser.email}</span>
            <button onclick="logout()" class="bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-700 px-3 py-1.5 rounded-xl text-xs font-medium transition">登出</button>
          </div>
        `;
        loadAssets();
        loadTransactions();
      } else {
        authCard.classList.remove('hidden');
        mainApp.classList.add('hidden');
        authStatusHeader.innerHTML = '';
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if (authMode === 'signup') {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert('註冊失敗：' + error.message);
        else {
          alert('註冊成功！');
          currentUser = data.user;
          updateUI();
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert('登入失敗：' + error.message);
        else {
          currentUser = data.user;
          updateUI();
        }
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      updateUI();
    }

    async function fetchRates() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await res.json();
        currentUsdRate = data.rates.TWD.toFixed(2);
        document.getElementById('usd-rate').innerText = 'NT$ ' + currentUsdRate;
      } catch (e) {
        document.getElementById('usd-rate').innerText = 'NT$ 32.26 (預設)';
      }
    }

    // 穩健抓價邏輯 (FinMind API 優先針對台股)
    async function fetchStockPrice(symbol) {
      if (!symbol) return null;
      let cleanSymbol = symbol.trim().toUpperCase().replace('.TW', '');

      // 1. 先用 FinMind API 抓台股 (免 CORS 擋、免 Key、極穩定)
      try {
        const finmindUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${cleanSymbol}&start_date=${getRecentDateStr()}`;
        const res = await fetch(finmindUrl);
        const data = await res.json();
        if (data && data.data && data.data.length > 0) {
          const latest = data.data[data.data.length - 1];
          return latest.close;
        }
      } catch (e) {
        console.warn('FinMind 抓價失敗，嘗試次要來源...');
      }

      // 2. 備用代理 抓取 Yahoo / Stooq
      try {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${cleanSymbol}.TW?interval=1d`;
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
        const data = await res.json();
        const price = data.chart.result[0].meta.regularMarketPrice;
        if (price) return price;
      } catch (e) {
        console.error(`無法抓取代碼 ${cleanSymbol} 價格`);
      }

      return null;
    }

    function getRecentDateStr() {
      const d = new Date();
      d.setDate(d.getDate() - 7);
      return d.toISOString().split('T')[0];
    }

    async function loadAssets() {
      if (!currentUser) return;
      const { data: assets, error } = await supabaseClient.from('assets').select('*');
      if (error) return console.error('Fetch error:', error);

      const tbody = document.getElementById('asset-table-body');
      if (!assets || assets.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-slate-500">目前尚無資產資料，點擊右上角「+ 新增資產」開始建立</td></tr>`;
        document.getElementById('total-assets').innerText = 'NT$ 0';
        return;
      }

      tbody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-slate-400">正在獲取最新即時價格...</td></tr>`;

      let totalTwd = 0;
      let tableRows = '';

      for (const a of assets) {
        let activePrice = a.current_price || 1;
        let isLivePrice = false;

        // 只有股票/基金類別才去抓價，現金類別跳過
        if (a.type === 'stock' || a.type === 'fund') {
          if (a.symbol) {
            const livePrice = await fetchStockPrice(a.symbol);
            if (livePrice !== null) {
              activePrice = livePrice;
              isLivePrice = true;
            }
          }
        } else if (a.type === 'cash') {
          activePrice = 1; // 現金單價永遠為 1
        }

        const rate = a.currency === 'USD' ? currentUsdRate : 1;
        const twdVal = a.quantity * activePrice * rate;
        totalTwd += twdVal;
        const displayType = typeMap[a.type] || a.type;

        tableRows += `
          <tr class="hover:bg-slate-700/30">
            <td class="p-3 font-medium text-slate-100">${a.name} <span class="text-xs text-slate-400">(${a.symbol || '-'})</span></td>
            <td class="p-3 text-slate-400">${displayType}</td>
            <td class="p-3">${a.quantity}</td>
            <td class="p-3 font-medium ${isLivePrice ? 'text-emerald-300' : 'text-slate-300'}">
              ${a.currency} ${Number(activePrice).toFixed(2)}
              ${isLivePrice ? '<span class="text-[10px] bg-emerald-900/60 text-emerald-300 border border-emerald-700 px-1.5 py-0.5 rounded ml-1">即時</span>' : (a.type === 'cash' ? '' : '<span class="text-[10px] text-slate-500 ml-1">(預設)</span>')}
            </td>
            <td class="p-3 font-semibold text-emerald-400">NT$ ${Math.round(twdVal).toLocaleString()}</td>
            <td class="p-3 text-center">
              <button onclick="deleteAsset('${a.id}')" class="text-red-400 hover:text-red-300 text-xs bg-red-950/50 hover:bg-red-900/50 border border-red-800 px-2.5 py-1 rounded-lg transition">刪除</button>
            </td>
          </tr>
        `;
      }

      tbody.innerHTML = tableRows;
      document.getElementById('total-assets').innerText = 'NT$ ' + Math.round(totalTwd).toLocaleString();
    }

    function toggleSymbolInput(type) {
      const symbolContainer = document.getElementById('symbol-container');
      const priceContainer = document.getElementById('price-container');
      const qtyLabel = document.getElementById('qty-label');

      if (type === 'cash') {
        symbolContainer.classList.add('hidden');
        priceContainer.classList.add('hidden');
        qtyLabel.innerText = '金額';
      } else {
        symbolContainer.classList.remove('hidden');
        priceContainer.classList.remove('hidden');
        qtyLabel.innerText = '持有數量 / 股數';
      }
    }

    async function handleAddAsset(e) {
      e.preventDefault();
      if (!currentUser) return alert('請先登入！');

      const name = document.getElementById('new-asset-name').value;
      const type = document.getElementById('new-asset-type').value;
      let symbol = document.getElementById('new-asset-symbol').value.trim();
      const quantity = parseFloat(document.getElementById('new-asset-qty').value);
      let current_price = parseFloat(document.getElementById('new-asset-price').value) || 1;
      const currency = document.getElementById('new-asset-currency').value;

      if (type === 'cash') {
        symbol = '';
        current_price = 1;
      }

      const { error } = await supabaseClient.from('assets').insert([{
        user_id: currentUser.id, name, symbol, type, quantity, current_price, currency
      }]);

      if (error) alert('新增資產失敗: ' + error.message);
      else {
        toggleAssetModal(false);
        loadAssets();
      }
    }

    async function deleteAsset(id) {
      if (!confirm('確定要刪除這筆資產嗎？')) return;
      const { error } = await supabaseClient.from('assets').delete().eq('id', id);
      if (error) alert('刪除失敗: ' + error.message);
      else loadAssets();
    }

    async function loadTransactions() {
      if (!currentUser) return;
      const { data: txs, error } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
      
      if (error) {
        document.getElementById('tx-list').innerHTML = `<div class="text-xs text-red-400 p-2">載入明細失敗：${error.message}</div>`;
        return;
      }

      rawTransactions = txs || [];
      updateMonthFilterOptions();
      renderTransactions();
    }

    function updateMonthFilterOptions() {
      const select = document.getElementById('tx-month-filter');
      const currentSelected = select.value;
      const monthsSet = new Set();

      rawTransactions.forEach(t => {
        const dateObj = t.created_at ? new Date(t.created_at) : new Date();
        const mStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
        monthsSet.add(mStr);
      });

      const sortedMonths = Array.from(monthsSet).sort().reverse();
      let html = `<option value="all">全部紀錄</option>`;
      sortedMonths.forEach(m => {
        html += `<option value="${m}">${m}</option>`;
      });

      select.innerHTML = html;
      if (Array.from(select.options).some(o => o.value === currentSelected)) {
        select.value = currentSelected;
      }
    }

    function renderTransactions() {
      const selectedMonth = document.getElementById('tx-month-filter').value;
      const container = document.getElementById('tx-list');

      let filtered = rawTransactions;
      if (selectedMonth !== 'all') {
        filtered = rawTransactions.filter(t => {
          const dateObj = t.created_at ? new Date(t.created_at) : new Date();
          const mStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
          return mStr === selectedMonth;
        });
      }

      let incSum = 0, expSum = 0;
      filtered.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income' || t.type === 'realize') incSum += amt;
        else if (t.type === 'expense') expSum += amt;
      });

      document.getElementById('sum-income').innerText = 'NT$ ' + Math.round(incSum).toLocaleString();
      document.getElementById('sum-expense').innerText = 'NT$ ' + Math.round(expSum).toLocaleString();
      document.getElementById('sum-net').innerText = 'NT$ ' + Math.round(incSum - expSum).toLocaleString();

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `<div class="text-center p-4 text-slate-500 text-xs">該月份尚無收支紀錄</div>`;
        return;
      }

      const txTypeBadge = {
        'income': { label: '收入', color: 'text-emerald-400 bg-emerald-950/60 border-emerald-700' },
        'expense': { label: '支出', color: 'text-rose-400 bg-rose-950/60 border-rose-700' },
        'realize': { label: '變現', color: 'text-blue-400 bg-blue-950/60 border-blue-700' }
      };

      container.innerHTML = filtered.map(t => {
        const badge = txTypeBadge[t.type] || { label: t.type, color: 'text-slate-300 bg-slate-800 border-slate-600' };
        const dateStr = t.created_at ? new Date(t.created_at).toLocaleDateString() : '';
        return `
          <div class="flex items-center justify-between p-2.5 bg-slate-900/60 rounded-xl border border-slate-700/50 text-xs">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded border ${badge.color}">${badge.label}</span>
              <div>
                <div class="font-medium text-slate-200">${t.category}</div>
                <div class="text-[10px] text-slate-500">${dateStr}</div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold text-slate-100">NT$ ${Number(t.amount).toLocaleString()}</span>
              <button onclick="deleteTransaction('${t.id}')" class="text-slate-500 hover:text-red-400 transition p-1">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleTransaction(e) {
      e.preventDefault();
      if (!currentUser) return alert('請先登入！');

      const type = document.getElementById('tx-type').value;
      const category = document.getElementById('tx-category').value;
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const dateVal = document.getElementById('tx-date').value;

      const created_at = dateVal ? new Date(dateVal).toISOString() : new Date().toISOString();

      const { error } = await supabaseClient.from('transactions').insert([{
        user_id: currentUser.id, type, category, amount, created_at
      }]);

      if (error) alert('紀錄失敗: ' + error.message);
      else {
        document.getElementById('tx-category').value = '';
        document.getElementById('tx-amount').value = '';
        loadTransactions();
      }
    }

    async function deleteTransaction(id) {
      if (!confirm('確定要刪除這筆收支紀錄嗎？')) return;
      const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
      if (error) alert('刪除失敗: ' + error.message);
      else loadTransactions();
    }

    function toggleAssetModal(show) {
      document.getElementById('asset-modal').classList.toggle('hidden', !show);
      if (show) toggleSymbolInput(document.getElementById('new-asset-type').value);
    }

    window.onload = init;
  </script>
</body>
</html>
