<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人資產管理系統 V2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <style>
    html { scroll-behavior:smooth; }
    body { background:#020617; }
    .glass { background:rgba(15,23,42,.82); backdrop-filter:blur(14px); }
    .input { width:100%; background:#020617; border:1px solid #334155; border-radius:.75rem; padding:.65rem .8rem; color:#e2e8f0; outline:none; }
    .input:focus { border-color:#10b981; box-shadow:0 0 0 2px rgba(16,185,129,.12); }
    .btn { border-radius:.75rem; padding:.6rem .9rem; font-size:.82rem; font-weight:600; transition:.18s; }
    .btn:hover { transform:translateY(-1px); }
    .card { background:#0f172a; border:1px solid #1e293b; border-radius:1rem; }
    .chip { display:inline-flex; align-items:center; border:1px solid #334155; background:#1e293b; border-radius:999px; padding:.18rem .55rem; font-size:.7rem; }
    .tab.active { color:#34d399; border-color:#10b981; background:rgba(16,185,129,.08); }
    .hidden-important { display:none !important; }
  </style>
</head>
<body class="text-slate-100 min-h-screen">
<div class="max-w-[1500px] mx-auto p-4 md:p-6 space-y-5">

  <header class="glass border border-slate-800 rounded-2xl p-5 shadow-2xl">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div>
        <div class="text-2xl md:text-3xl font-black text-emerald-400">💰 個人資產管理系統 <span class="text-xs align-middle text-slate-500">V2</span></div>
        <p class="text-sm text-slate-400 mt-1">資產、帳戶、收支與投資配置集中管理</p>
      </div>
      <div id="auth-status-header"></div>
    </div>
  </header>

  <section id="auth-card" class="card max-w-md mx-auto p-6 shadow-xl">
    <h2 id="auth-title" class="text-xl font-bold text-emerald-400 text-center mb-5">🔑 帳號登入 / 註冊</h2>
    <form onsubmit="handleAuth(event)" class="space-y-4 text-sm">
      <div><label class="block text-slate-400 mb-1">電子郵件</label><input id="auth-email" type="email" class="input" placeholder="your@email.com" required></div>
      <div><label class="block text-slate-400 mb-1">密碼</label><input id="auth-password" type="password" class="input" required></div>
      <div class="flex gap-3">
        <button class="btn w-1/2 bg-emerald-600 hover:bg-emerald-500" type="submit" onclick="authMode='login'">直接登入</button>
        <button class="btn w-1/2 bg-slate-700 hover:bg-slate-600" type="submit" onclick="authMode='signup'">註冊</button>
      </div>
      <button type="button" onclick="handleResetPassword()" class="w-full text-xs text-slate-400 hover:text-emerald-400 underline">忘記密碼？</button>
    </form>
  </section>

  <main id="main-app" class="hidden space-y-5">
    <nav class="card p-2 flex flex-wrap gap-2">
      <button class="tab active btn border border-slate-700" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</button>
      <button class="tab btn border border-transparent text-slate-400" data-tab="assets" onclick="switchTab('assets')">💰 資產</button>
      <button class="tab btn border border-transparent text-slate-400" data-tab="accounts" onclick="switchTab('accounts')">🏦 帳戶</button>
      <button class="tab btn border border-transparent text-slate-400" data-tab="transactions" onclick="switchTab('transactions')">💳 收支</button>
    </nav>

    <!-- Dashboard -->
    <section id="tab-dashboard" class="space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
        <div class="card p-5"><div class="text-xs text-slate-400">總資產估值</div><div id="total-assets" class="text-2xl font-black text-emerald-400 mt-2">NT$ 0</div></div>
        <div class="card p-5"><div class="text-xs text-slate-400">股票 / ETF</div><div id="stat-stock" class="text-2xl font-black mt-2">NT$ 0</div></div>
        <div class="card p-5"><div class="text-xs text-slate-400">現金 / 存款</div><div id="stat-cash" class="text-2xl font-black mt-2">NT$ 0</div></div>
        <div class="card p-5"><div class="text-xs text-slate-400">其他資產</div><div id="stat-other" class="text-2xl font-black mt-2">NT$ 0</div></div>
        <div class="card p-5"><div class="text-xs text-slate-400">USD / TWD</div><div id="usd-rate" class="text-2xl font-black text-blue-400 mt-2">載入中…</div></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div class="card p-5 lg:col-span-2">
          <div class="flex justify-between items-center mb-4">
            <div><h2 class="font-bold text-lg">資產配置</h2><p class="text-xs text-slate-500">依資產類別計算</p></div>
            <button class="btn bg-slate-800 hover:bg-slate-700" onclick="refreshAll()">🔄 更新</button>
          </div>
          <div class="h-72"><canvas id="allocation-chart"></canvas></div>
        </div>
        <div class="card p-5">
          <h2 class="font-bold text-lg mb-4">🏦 帳戶分布</h2>
          <div id="dashboard-account-list" class="space-y-3"></div>
        </div>
      </div>

      <div class="card p-5">
        <h2 class="font-bold text-lg mb-4">📌 最近資產</h2>
        <div id="recent-assets" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3"></div>
      </div>
    </section>

    <!-- Assets -->
    <section id="tab-assets" class="hidden space-y-5">
      <div class="card p-5">
        <div class="flex flex-col xl:flex-row xl:items-end gap-3">
          <div class="flex-1"><label class="text-xs text-slate-400">搜尋資產</label><input id="asset-search" class="input mt-1" placeholder="搜尋名稱、代碼、帳戶…" oninput="renderAssets()"></div>
          <div><label class="text-xs text-slate-400">檢視方式</label><select id="asset-view" class="input mt-1" onchange="renderAssets()"><option value="flat">全部列表</option><option value="account">依帳戶</option><option value="category">依資產類別</option><option value="currency">依幣別</option></select></div>
          <div><label class="text-xs text-slate-400">帳戶</label><select id="asset-filter-account" class="input mt-1" onchange="renderAssets()"><option value="all">全部帳戶</option></select></div>
          <div><label class="text-xs text-slate-400">類別</label><select id="asset-filter-category" class="input mt-1" onchange="renderAssets()"><option value="all">全部類別</option><option value="stock">股票 / ETF</option><option value="cash">現金 / 存款</option><option value="fund">基金</option><option value="gold">黃金</option><option value="other">其他</option></select></div>
          <div><label class="text-xs text-slate-400">排序</label><select id="asset-sort" class="input mt-1" onchange="renderAssets()"><option value="value_desc">市值：高 → 低</option><option value="value_asc">市值：低 → 高</option><option value="name">名稱 A → Z</option><option value="account">帳戶 A → Z</option></select></div>
          <button class="btn bg-emerald-600 hover:bg-emerald-500" onclick="openAssetModal()">＋ 新增資產</button>
        </div>
      </div>
      <div class="card p-5">
        <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">📊 資產清單</h2><span id="asset-count" class="text-xs text-slate-500"></span></div>
        <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-xs text-slate-400 border-b border-slate-700"><tr><th class="p-3 text-left">名稱 / 代碼</th><th class="p-3 text-left">類別</th><th class="p-3 text-left">帳戶</th><th class="p-3 text-right">數量</th><th class="p-3 text-right">價格</th><th class="p-3 text-right">台幣市值</th><th class="p-3 text-center">操作</th></tr></thead><tbody id="asset-table-body"></tbody></table></div>
      </div>
    </section>

    <!-- Accounts -->
    <section id="tab-accounts" class="hidden space-y-5">
      <div class="card p-5">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
          <div><h2 class="font-bold text-xl">🏦 帳戶管理</h2><p class="text-xs text-slate-500 mt-1">新增後會出現在資產新增表單的下拉選單</p></div>
          <button class="btn bg-emerald-600 hover:bg-emerald-500" onclick="openAccountModal()">＋ 新增帳戶</button>
        </div>
      </div>
      <div id="accounts-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </section>

    <!-- Transactions -->
    <section id="tab-transactions" class="hidden space-y-5">
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <div class="card p-5 lg:col-span-2">
          <h2 class="font-bold text-lg mb-4">💳 新增收支</h2>
          <form onsubmit="handleTransaction(event)" class="space-y-3 text-sm">
            <div><label class="text-xs text-slate-400">交易類型</label><select id="tx-type" class="input mt-1"><option value="income">💵 收入</option><option value="expense">💸 支出</option><option value="realize">🔄 資產變現</option></select></div>
            <div><label class="text-xs text-slate-400">說明 / 分類</label><input id="tx-category" class="input mt-1" placeholder="例如：薪資、股息、生活費" required></div>
            <div><label class="text-xs text-slate-400">金額（TWD）</label><input id="tx-amount" type="number" step="any" class="input mt-1" required></div>
            <div><label class="text-xs text-slate-400">日期</label><input id="tx-date" type="date" class="input mt-1" required></div>
            <button class="btn w-full bg-blue-600 hover:bg-blue-500">紀錄</button>
          </form>
        </div>
        <div class="card p-5 lg:col-span-3">
          <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-4">
            <h2 class="font-bold text-lg">📜 收支歷史</h2>
            <select id="tx-month-filter" onchange="renderTransactions()" class="input sm:w-48"><option value="all">全部紀錄</option></select>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center text-xs mb-4">
            <div class="bg-slate-950 p-3 rounded-xl"><div class="text-slate-500">收入</div><div id="sum-income" class="text-emerald-400 font-bold mt-1">NT$ 0</div></div>
            <div class="bg-slate-950 p-3 rounded-xl"><div class="text-slate-500">支出</div><div id="sum-expense" class="text-rose-400 font-bold mt-1">NT$ 0</div></div>
            <div class="bg-slate-950 p-3 rounded-xl"><div class="text-slate-500">淨額</div><div id="sum-net" class="text-blue-400 font-bold mt-1">NT$ 0</div></div>
          </div>
          <div id="tx-list" class="space-y-2 max-h-[420px] overflow-y-auto"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Asset Modal -->
<div id="asset-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 items-center justify-center p-4">
  <div class="card w-full max-w-lg p-6 max-h-[92vh] overflow-y-auto">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4"><h3 id="asset-modal-title" class="font-bold text-lg">➕ 新增資產</h3><button onclick="closeAssetModal()" class="text-slate-400">✕</button></div>
    <form onsubmit="handleAddAsset(event)" class="space-y-3 text-sm">
      <input id="asset-edit-id" type="hidden">
      <div><label class="text-xs text-slate-400">資產類別</label><select id="new-asset-type" class="input mt-1" onchange="toggleSymbolInput(this.value)"><option value="stock">📈 股票 / ETF</option><option value="cash">💵 現金 / 存款</option><option value="fund">🏦 基金</option><option value="gold">🏆 黃金</option><option value="other">📦 其他</option></select></div>
      <div id="symbol-container"><label class="text-xs text-slate-400">股票代碼</label><input id="new-asset-symbol" class="input mt-1" oninput="handleSymbolInput(this.value)" placeholder="例如 0050 / VOO"></div>
      <div><label class="text-xs text-slate-400">資產名稱</label><input id="new-asset-name" class="input mt-1" required placeholder="例如 Vanguard S&P 500 ETF"></div>
      <div><label class="text-xs text-slate-400">帳戶</label><select id="new-asset-account" class="input mt-1"></select></div>
      <div><label id="qty-label" class="text-xs text-slate-400">數量 / 股數</label><input id="new-asset-qty" type="number" step="any" class="input mt-1" required></div>
      <div id="price-container"><label class="text-xs text-slate-400">備用單價</label><input id="new-asset-price" type="number" step="any" value="1" class="input mt-1"></div>
      <div><label class="text-xs text-slate-400">計價幣別</label><select id="new-asset-currency" class="input mt-1"><option value="TWD">新台幣 (TWD)</option><option value="USD">美元 (USD)</option></select></div>
      <div><label class="text-xs text-slate-400">備註</label><input id="new-asset-remark" class="input mt-1" placeholder="可留空"></div>
      <div class="flex gap-2 pt-2"><button type="button" onclick="closeAssetModal()" class="btn w-1/2 bg-slate-700">取消</button><button class="btn w-1/2 bg-emerald-600 hover:bg-emerald-500">儲存</button></div>
    </form>
  </div>
</div>

<!-- Account Modal -->
<div id="account-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 items-center justify-center p-4">
  <div class="card w-full max-w-md p-6">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4"><h3 id="account-modal-title" class="font-bold text-lg">🏦 新增帳戶</h3><button onclick="closeAccountModal()" class="text-slate-400">✕</button></div>
    <form onsubmit="saveAccount(event)" class="space-y-3 text-sm">
      <input id="account-edit-id" type="hidden">
      <div><label class="text-xs text-slate-400">帳戶名稱</label><input id="account-name" class="input mt-1" placeholder="例如：Firstrade" required></div>
      <div><label class="text-xs text-slate-400">帳戶類型</label><select id="account-type" class="input mt-1"><option value="broker">券商</option><option value="bank">銀行</option><option value="cash">現金</option><option value="other">其他</option></select></div>
      <div class="flex gap-2 pt-2"><button type="button" onclick="closeAccountModal()" class="btn w-1/2 bg-slate-700">取消</button><button class="btn w-1/2 bg-emerald-600">儲存</button></div>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zsrnxfluhqjseltmgimm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ix_4ZSypiUVpMxdDzE8Frg___QsGMfO';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null, authMode = 'login', currentUsdRate = 32.21;
let rawTransactions = [], loadedAssets = [], accounts = [], assetValues = [];
let allocationChart = null;

const knownStockNames = {
  VOO:'Vanguard S&P 500 ETF', QQQ:'Invesco QQQ Trust', SPY:'SPDR S&P 500 ETF Trust',
  VT:'Vanguard Total World Stock ETF', AAPL:'Apple Inc.', NVDA:'NVIDIA Corporation',
  TSLA:'Tesla, Inc.', MSFT:'Microsoft Corporation', 0050:'元大台灣50', 0056:'元大高股息',
  00878:'國泰永續高股息', 00919:'群益台灣精選高息', 00929:'復華台灣科技優息', 2330:'台積電'
};
const typeMap = {stock:'股票 / ETF', cash:'現金 / 存款', fund:'基金', gold:'黃金', other:'其他'};
const accountTypeMap = {broker:'券商', bank:'銀行', cash:'現金', other:'其他'};

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function money(n) { return 'NT$ ' + Math.round(Number(n)||0).toLocaleString(); }
function openModal(id){ const e=document.getElementById(id); e.classList.remove('hidden'); e.classList.add('flex'); }
function closeModal(id){ const e=document.getElementById(id); e.classList.add('hidden'); e.classList.remove('flex'); }

async function init() {
  document.getElementById('tx-date').value = new Date().toISOString().slice(0,10);
  await fetchRates();
  const {data:{user}} = await supabaseClient.auth.getUser();
  currentUser = user;
  updateUI();
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      setTimeout(async()=>{
        const p = prompt('請輸入新密碼：');
        if (p) {
          const {error}=await supabaseClient.auth.updateUser({password:p});
          alert(error ? '密碼更新失敗：'+error.message : '密碼已更新！');
        }
      },500);
    }
    currentUser = session?.user || null;
    updateUI();
  });
}

function updateUI() {
  const authCard=document.getElementById('auth-card'), main=document.getElementById('main-app'), header=document.getElementById('auth-status-header');
  if (currentUser) {
    authCard.classList.add('hidden'); main.classList.remove('hidden');
    header.innerHTML = `<div class="flex items-center gap-3"><span class="text-sm text-slate-300">👤 ${esc(currentUser.email)}</span><button onclick="logout()" class="btn bg-red-950/70 text-red-300 border border-red-800">登出</button></div>`;
    refreshAll();
  } else {
    authCard.classList.remove('hidden'); main.classList.add('hidden'); header.innerHTML='';
  }
}

async function handleAuth(e) {
  e.preventDefault();
  const email=document.getElementById('auth-email').value.trim(), password=document.getElementById('auth-password').value;
  const result = authMode==='signup'
    ? await supabaseClient.auth.signUp({email,password})
    : await supabaseClient.auth.signInWithPassword({email,password});
  if(result.error) return alert((authMode==='signup'?'註冊':'登入')+'失敗：'+result.error.message);
  currentUser=result.data.user; updateUI();
  if(authMode==='signup') alert('註冊成功！若 Supabase 啟用 Email 驗證，請先完成信箱驗證。');
}
async function handleResetPassword() {
  const email=document.getElementById('auth-email').value.trim();
  if(!email) return alert('請先輸入 Email。');
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
  alert(error?'發送失敗：'+error.message:'重設密碼郵件已發送，請至信箱確認。');
}
async function logout(){ await supabaseClient.auth.signOut(); currentUser=null; updateUI(); }

async function fetchRates(){
  try {
    const r=await fetch('https://open.er-api.com/v6/latest/USD'); const d=await r.json();
    if(d?.rates?.TWD) currentUsdRate=Number(d.rates.TWD.toFixed(2));
  } catch(e){}
  document.getElementById('usd-rate').textContent='NT$ '+currentUsdRate.toFixed(2);
}

async function refreshAll(){
  if(!currentUser) return;
  await loadAccounts();
  await loadAssets();
  await loadTransactions();
  renderAccounts();
  renderDashboard();
}

async function loadAccounts(){
  const {data,error}=await supabaseClient.from('accounts').select('*').order('sort_order',{ascending:true}).order('name',{ascending:true});
  if(error){
    accounts=[];
    console.warn('accounts table 尚未建立或讀取失敗：',error.message);
    populateAccountSelects();
    document.getElementById('accounts-grid').innerHTML=`<div class="card p-5 text-amber-300 md:col-span-2 xl:col-span-3">尚未建立 accounts 資料表。請先執行我提供的 <b>supabase_v2.sql</b>。</div>`;
    return;
  }
  accounts=data||[];
  populateAccountSelects();
}

function populateAccountSelects(){
  const opts=accounts.length ? accounts.map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('') : '<option value="預設帳戶">預設帳戶</option>';
  const assetSel=document.getElementById('new-asset-account');
  assetSel.innerHTML=opts;
  const filter=document.getElementById('asset-filter-account');
  const old=filter.value;
  filter.innerHTML='<option value="all">全部帳戶</option>'+accounts.map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('');
  if([...filter.options].some(o=>o.value===old)) filter.value=old;
}

function openAccountModal(id=''){
  document.getElementById('account-edit-id').value=id;
  document.getElementById('account-modal-title').textContent=id?'✏️ 編輯帳戶':'🏦 新增帳戶';
  const a=accounts.find(x=>String(x.id)===String(id));
  document.getElementById('account-name').value=a?.name||'';
  document.getElementById('account-type').value=a?.type||'broker';
  openModal('account-modal');
}
function closeAccountModal(){closeModal('account-modal');}

async function saveAccount(e){
  e.preventDefault(); if(!currentUser)return;
  const id=document.getElementById('account-edit-id').value;
  const name=document.getElementById('account-name').value.trim();
  const type=document.getElementById('account-type').value;
  if(!name)return;
  const duplicate=accounts.find(a=>a.name.toLowerCase()===name.toLowerCase() && String(a.id)!==String(id));
  if(duplicate)return alert('這個帳戶名稱已存在。');
  const payload={user_id:currentUser.id,name,type,sort_order:accounts.length};
  const q=id
    ? supabaseClient.from('accounts').update({name,type}).eq('id',id).eq('user_id',currentUser.id)
    : supabaseClient.from('accounts').insert([payload]);
  const {error}=await q;
  if(error)return alert('儲存帳戶失敗：'+error.message);
  closeAccountModal(); await loadAccounts(); renderAccounts(); renderAssets();
}

async function deleteAccount(id){
  const a=accounts.find(x=>String(x.id)===String(id)); if(!a)return;
  const used=loadedAssets.some(x=>(x.account||'預設帳戶')===a.name);
  if(used)return alert('這個帳戶仍有資產，請先把資產移到其他帳戶再刪除。');
  if(!confirm(`確定刪除「${a.name}」？`))return;
  const {error}=await supabaseClient.from('accounts').delete().eq('id',id).eq('user_id',currentUser.id);
  if(error)return alert('刪除失敗：'+error.message);
  await loadAccounts(); renderAccounts();
}

function renderAccounts(){
  const c=document.getElementById('accounts-grid');
  if(!accounts.length){c.innerHTML='<div class="card p-8 text-center text-slate-500 md:col-span-2 xl:col-span-3">尚無帳戶，按右上角「新增帳戶」建立第一個帳戶。</div>';return;}
  c.innerHTML=accounts.map(a=>{
    const total=assetValues.filter(x=>x.account===a.name).reduce((s,x)=>s+x.twd,0);
    return `<div class="card p-5">
      <div class="flex justify-between gap-3"><div><div class="text-lg font-bold">${esc(a.name)}</div><div class="text-xs text-slate-500 mt-1">${esc(accountTypeMap[a.type]||'其他')}</div></div><div class="flex gap-1"><button class="btn bg-slate-800" onclick="openAccountModal('${a.id}')">編輯</button><button class="btn bg-red-950/60 text-red-300" onclick="deleteAccount('${a.id}')">刪除</button></div></div>
      <div class="text-2xl font-black text-emerald-400 mt-5">${money(total)}</div>
      <button class="mt-3 text-xs text-blue-400 hover:text-blue-300" onclick="filterByAccount('${esc(a.name)}')">查看此帳戶資產 →</button>
    </div>`;
  }).join('');
}

async function fetchStockPrice(symbol){
  if(!symbol)return null;
  const clean=symbol.trim().toUpperCase().replace('.TW','');
  if(/^\d+$/.test(clean)){
    try{
      const url=`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${clean}&start_date=${recentDate()}`;
      const r=await fetch(url); const d=await r.json();
      if(d?.data?.length)return Number(d.data[d.data.length-1].close);
    }catch(e){}
  } else {
    try{
      const target=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(clean)}?interval=1d`;
      const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(target)}`); const d=await r.json();
      const p=d?.chart?.result?.[0]?.meta?.regularMarketPrice;
      if(p)return Number(p);
    }catch(e){}
  }
  return null;
}
function recentDate(){const d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);}

async function loadAssets(){
  if(!currentUser)return;
  const {data,error}=await supabaseClient.from('assets').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);document.getElementById('asset-table-body').innerHTML=`<tr><td colspan="7" class="p-6 text-center text-red-400">資產載入失敗：${esc(error.message)}</td></tr>`;return;}
  loadedAssets=data||[];
  assetValues=[];
  for(const a of loadedAssets){
    let currency=a.currency||((a.symbol&&/^[A-Za-z]+$/.test(a.symbol))?'USD':'TWD');
    let price=Number(a.current_price)||1, live=false;
    if((a.type==='stock'||a.type==='fund')&&a.symbol){
      const p=await fetchStockPrice(a.symbol); if(p!==null){price=p;live=true;}
    }
    if(a.type==='cash')price=1;
    const twd=Number(a.quantity||0)*price*(currency==='USD'?currentUsdRate:1);
    assetValues.push({...a,price,currency,twd,live,account:a.account||'預設帳戶'});
  }
  renderAssets(); renderDashboard(); renderAccounts();
}

function renderAssets(){
  const search=(document.getElementById('asset-search')?.value||'').trim().toLowerCase();
  const acc=document.getElementById('asset-filter-account')?.value||'all';
  const cat=document.getElementById('asset-filter-category')?.value||'all';
  const sort=document.getElementById('asset-sort')?.value||'value_desc';
  let rows=assetValues.filter(a=>{
    const hay=[a.name,a.symbol,a.account,a.currency,typeMap[a.type]].join(' ').toLowerCase();
    return (!search||hay.includes(search))&&(acc==='all'||a.account===acc)&&(cat==='all'||a.type===cat);
  });
  rows.sort((a,b)=>{
    if(sort==='value_asc')return a.twd-b.twd;
    if(sort==='name')return String(a.name).localeCompare(String(b.name),'zh-Hant');
    if(sort==='account')return String(a.account).localeCompare(String(b.account),'zh-Hant');
    return b.twd-a.twd;
  });
  document.getElementById('asset-count').textContent=`顯示 ${rows.length} / ${assetValues.length} 筆`;
  const view=document.getElementById('asset-view').value;
  const body=document.getElementById('asset-table-body');
  if(!rows.length){body.innerHTML='<tr><td colspan="7" class="p-8 text-center text-slate-500">找不到符合條件的資產。</td></tr>';return;}
  if(view==='flat'){body.innerHTML=rows.map(assetRow).join('');return;}
  const groups={};
  rows.forEach(a=>{const key=view==='account'?a.account:view==='category'?(typeMap[a.type]||a.type):a.currency;(groups[key]??=[]).push(a);});
  body.innerHTML=Object.entries(groups).map(([key,list])=>{
    const subtotal=list.reduce((s,a)=>s+a.twd,0);
    return `<tr><td colspan="7" class="p-3 bg-slate-950 border-t border-slate-700"><div class="flex justify-between"><span class="font-bold text-emerald-300">▼ ${esc(key)}</span><span class="text-xs text-slate-500">${money(subtotal)}</span></div></td></tr>${list.map(assetRow).join('')}`;
  }).join('');
}
function assetRow(a){
  return `<tr class="border-t border-slate-800 hover:bg-slate-800/50">
    <td class="p-3"><div class="font-semibold">${esc(a.name)}</div><div class="text-[11px] text-slate-500">${esc(a.symbol||'-')}</div></td>
    <td class="p-3"><span class="chip">${esc(typeMap[a.type]||a.type)}</span></td>
    <td class="p-3">${esc(a.account)}</td>
    <td class="p-3 text-right">${Number(a.quantity).toLocaleString(undefined,{maximumFractionDigits:6})}</td>
    <td class="p-3 text-right ${a.live?'text-emerald-300':'text-slate-300'}">${a.currency} ${Number(a.price).toFixed(2)} ${a.live?'<span class="text-[9px]">即時</span>':''}</td>
    <td class="p-3 text-right font-bold text-emerald-400">${money(a.twd)}</td>
    <td class="p-3 text-center whitespace-nowrap"><button class="text-blue-400 text-xs mr-2" onclick="openAssetModal('${a.id}')">編輯</button><button class="text-red-400 text-xs" onclick="deleteAsset('${a.id}')">刪除</button></td>
  </tr>`;
}

function filterByAccount(name){
  switchTab('assets');
  document.getElementById('asset-filter-account').value=name;
  renderAssets();
}

function renderDashboard(){
  const total=assetValues.reduce((s,a)=>s+a.twd,0);
  const stock=assetValues.filter(a=>a.type==='stock').reduce((s,a)=>s+a.twd,0);
  const cash=assetValues.filter(a=>a.type==='cash').reduce((s,a)=>s+a.twd,0);
  const other=total-stock-cash;
  document.getElementById('total-assets').textContent=money(total);
  document.getElementById('stat-stock').textContent=money(stock);
  document.getElementById('stat-cash').textContent=money(cash);
  document.getElementById('stat-other').textContent=money(other);
  const byCat={}; assetValues.forEach(a=>byCat[typeMap[a.type]||a.type]=(byCat[typeMap[a.type]||a.type]||0)+a.twd);
  if(allocationChart)allocationChart.destroy();
  allocationChart=new Chart(document.getElementById('allocation-chart'),{
    type:'doughnut',
    data:{labels:Object.keys(byCat),datasets:[{data:Object.values(byCat),borderWidth:1}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#cbd5e1'}}}}
  });
  const byAcc={}; assetValues.forEach(a=>byAcc[a.account]=(byAcc[a.account]||0)+a.twd);
  document.getElementById('dashboard-account-list').innerHTML=Object.entries(byAcc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const pct=total?v/total*100:0;return `<button onclick="filterByAccount('${esc(k)}')" class="w-full text-left"><div class="flex justify-between text-xs"><span>${esc(k)}</span><span>${money(v)}</span></div><div class="h-1.5 bg-slate-800 rounded-full mt-1"><div class="h-1.5 bg-emerald-500 rounded-full" style="width:${pct}%"></div></div></button>`;
  }).join('')||'<div class="text-sm text-slate-500">尚無資產</div>';
  document.getElementById('recent-assets').innerHTML=assetValues.slice(0,4).map(a=>`<div class="bg-slate-950 rounded-xl p-4 border border-slate-800"><div class="font-semibold">${esc(a.name)}</div><div class="text-xs text-slate-500 mt-1">${esc(a.account)} · ${esc(typeMap[a.type])}</div><div class="font-bold text-emerald-400 mt-3">${money(a.twd)}</div></div>`).join('')||'<div class="text-slate-500 text-sm">尚無資產</div>';
}

function openAssetModal(id=''){
  document.getElementById('asset-edit-id').value=id;
  document.getElementById('asset-modal-title').textContent=id?'✏️ 編輯資產':'➕ 新增資產';
  const a=assetValues.find(x=>String(x.id)===String(id));
  document.getElementById('new-asset-type').value=a?.type||'stock';
  document.getElementById('new-asset-symbol').value=a?.symbol||'';
  document.getElementById('new-asset-name').value=a?.name||'';
  document.getElementById('new-asset-account').value=a?.account||accounts[0]?.name||'預設帳戶';
  document.getElementById('new-asset-qty').value=a?.quantity??'';
  document.getElementById('new-asset-price').value=a?.current_price??1;
  document.getElementById('new-asset-currency').value=a?.currency||'TWD';
  document.getElementById('new-asset-remark').value=a?.remark||'';
  toggleSymbolInput(document.getElementById('new-asset-type').value);
  openModal('asset-modal');
}
function closeAssetModal(){closeModal('asset-modal');}
function toggleSymbolInput(type){
  const hide=type==='cash';
  document.getElementById('symbol-container').classList.toggle('hidden',hide);
  document.getElementById('price-container').classList.toggle('hidden',hide);
  document.getElementById('qty-label').textContent=hide?'金額':'數量 / 股數';
  if(hide){document.getElementById('new-asset-symbol').value='';document.getElementById('new-asset-price').value=1;}
}
function handleSymbolInput(v){
  const s=v.trim().toUpperCase();
  if(knownStockNames[s])document.getElementById('new-asset-name').value=knownStockNames[s];
  else if(s)document.getElementById('new-asset-name').value=s;
  if(/^[A-Z]+$/.test(s))document.getElementById('new-asset-currency').value='USD';
  else if(/^\d+$/.test(s))document.getElementById('new-asset-currency').value='TWD';
}

async function handleAddAsset(e){
  e.preventDefault(); if(!currentUser)return alert('請先登入。');
  const id=document.getElementById('asset-edit-id').value;
  const type=document.getElementById('new-asset-type').value;
  const symbol=document.getElementById('new-asset-symbol').value.trim().toUpperCase();
  const name=document.getElementById('new-asset-name').value.trim();
  const account=document.getElementById('new-asset-account').value;
  const quantity=Number(document.getElementById('new-asset-qty').value);
  const current_price=type==='cash'?1:(Number(document.getElementById('new-asset-price').value)||1);
  const currency=document.getElementById('new-asset-currency').value;
  const remark=document.getElementById('new-asset-remark').value.trim();
  if(!name||!Number.isFinite(quantity))return alert('請完整填寫資產名稱與數量。');
  const payload={name,type,symbol:type==='cash'?'':symbol,account,quantity,current_price,currency,remark,user_id:currentUser.id};
  let result;
  if(id) result=await supabaseClient.from('assets').update(payload).eq('id',id).eq('user_id',currentUser.id);
  else {
    const existing=loadedAssets.find(a=>(a.account||'預設帳戶')===account && (type==='cash'?a.type==='cash'&&a.currency===currency:(a.symbol||'').toUpperCase()===symbol&&a.type===type));
    if(existing){
      result=await supabaseClient.from('assets').update({quantity:Number(existing.quantity)+quantity,current_price,currency,remark}).eq('id',existing.id).eq('user_id',currentUser.id);
    } else result=await supabaseClient.from('assets').insert([payload]);
  }
  if(result.error)return alert('儲存資產失敗：'+result.error.message);
  closeAssetModal(); await loadAssets(); renderDashboard(); renderAccounts();
}
async function deleteAsset(id){
  if(!confirm('確定要刪除這筆資產嗎？'))return;
  const {error}=await supabaseClient.from('assets').delete().eq('id',id).eq('user_id',currentUser.id);
  if(error)return alert('刪除失敗：'+error.message);
  await loadAssets(); renderDashboard(); renderAccounts();
}

async function loadTransactions(){
  if(!currentUser)return;
  const {data,error}=await supabaseClient.from('transactions').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('tx-list').innerHTML=`<div class="text-red-400 text-xs">載入失敗：${esc(error.message)}</div>`;return;}
  rawTransactions=data||[]; updateMonthFilterOptions(); renderTransactions();
}
function updateMonthFilterOptions(){
  const s=document.getElementById('tx-month-filter'), old=s.value, months=[...new Set(rawTransactions.map(t=>{const d=new Date(t.created_at);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}))].sort().reverse();
  s.innerHTML='<option value="all">全部紀錄</option>'+months.map(m=>`<option value="${m}">${m}</option>`).join('');
  if([...s.options].some(o=>o.value===old))s.value=old;
}
function renderTransactions(){
  const selected=document.getElementById('tx-month-filter').value;
  const list=selected==='all'?rawTransactions:rawTransactions.filter(t=>{const d=new Date(t.created_at);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`===selected;});
  let inc=0,exp=0; list.forEach(t=>t.type==='expense'?exp+=Number(t.amount)||0:inc+=Number(t.amount)||0);
  document.getElementById('sum-income').textContent=money(inc);document.getElementById('sum-expense').textContent=money(exp);document.getElementById('sum-net').textContent=money(inc-exp);
  const badges={income:['收入','text-emerald-300 bg-emerald-950'],expense:['支出','text-rose-300 bg-rose-950'],realize:['變現','text-blue-300 bg-blue-950']};
  document.getElementById('tx-list').innerHTML=list.length?list.map(t=>{const b=badges[t.type]||[t.type,'text-slate-300 bg-slate-800'];return `<div class="flex justify-between items-center gap-3 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs"><div class="flex items-center gap-3"><span class="px-2 py-1 rounded ${b[1]}">${b[0]}</span><div><div class="font-semibold">${esc(t.category)}</div><div class="text-slate-600 mt-1">${new Date(t.created_at).toLocaleDateString('zh-TW')}</div></div></div><div class="flex items-center gap-3"><b>${money(t.amount)}</b><button onclick="deleteTransaction('${t.id}')" class="text-slate-500 hover:text-red-400">✕</button></div></div>`}).join(''):'<div class="text-center text-slate-500 p-8 text-sm">尚無紀錄</div>';
}
async function handleTransaction(e){
  e.preventDefault(); if(!currentUser)return;
  const type=document.getElementById('tx-type').value, category=document.getElementById('tx-category').value.trim(), amount=Number(document.getElementById('tx-amount').value), date=document.getElementById('tx-date').value;
  const {error}=await supabaseClient.from('transactions').insert([{user_id:currentUser.id,type,category,amount,created_at:new Date(date+'T00:00:00').toISOString()}]);
  if(error)return alert('紀錄失敗：'+error.message);
  document.getElementById('tx-category').value='';document.getElementById('tx-amount').value='';await loadTransactions();
}
async function deleteTransaction(id){
  if(!confirm('確定刪除這筆紀錄？'))return;
  const {error}=await supabaseClient.from('transactions').delete().eq('id',id).eq('user_id',currentUser.id);
  if(error)return alert('刪除失敗：'+error.message); await loadTransactions();
}

function switchTab(tab){
  document.querySelectorAll('[id^="tab-"]').forEach(e=>e.classList.add('hidden'));
  document.getElementById('tab-'+tab).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`)?.classList.add('active');
}
window.onload=init;
</script>
