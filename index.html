<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth 測試</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; padding-top: 80px; }
    .box { background: #1e293b; padding: 30px; border-radius: 16px; width: 320px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .login { background: #10b981; color: white; }
    .signup { background: #334155; color: white; }
    #msg { margin-top: 12px; font-size: 14px; text-align: center; min-height: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="text-align:center; color:#34d399;">Auth 測試</h2>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="密碼（至少6碼）" />
    <button class="login" onclick="doLogin()">登入</button>
    <button class="signup" onclick="doSignup()">註冊</button>
    <div id="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zsrnxfluhqjseltmgimm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ix_4ZSypiUVpMxdDzE8Frg___QsGMfO';

    // 這裡改成 sb，避免跟函式庫的 supabase 衝突
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function show(msg, isError = false) {
      const el = document.getElementById('msg');
      el.style.color = isError ? '#f87171' : '#34d399';
      el.textContent = msg;
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      show('登入中...');
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        show('登入失敗：' + error.message, true);
        console.error(error);
      } else {
        show('登入成功！' + data.user.email);
      }
    }

    async function doSignup() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        show('請輸入 Email 和密碼', true);
        return;
      }
      if (password.length < 6) {
        show('密碼至少要 6 個字元', true);
        return;
      }

      show('註冊中...');
      try {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) {
          show('註冊失敗：' + error.message, true);
          console.error(error);
        } else {
          show('註冊成功！請直接嘗試登入');
          console.log(data);
        }
      } catch (err) {
        show('發生例外錯誤，請看 Console', true);
        console.error(err);
      }
    }

    console.log('Supabase client 已建立', sb);
  </script>
</body>
</html>
