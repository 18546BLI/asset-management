<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人理財與投資配置儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f5f7fa; color: #333; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { background: #1e293b; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { font-size: 1.25rem; color: #0f172a; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    
    /* 投資資產進度條 */
    .asset-item { margin-bottom: 16px; }
    .asset-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
    .progress-bar { height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 6px; }
    
    .stock-bg { background-color: #3b82f6; }
    .gold-bg { background-color: #eab308; } /* 黃金色彩 */
    .cash-bg { background-color: #10b981; }

    /* 表單樣式 */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #475569; margin-bottom: 6px; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #1d4ed8; }
    
    /* 標籤頁開關 */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 18px; border-radius: 8px; border: none; background: #e2e8f0; cursor: pointer; font-weight: 600; color: #475569; }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>理財計畫與帳戶設定</h1>
    <p>每月投資定額：NT$ 50,000</p>
  </header>

  <!-- 頁籤選單 -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('portfolio')">資產配置計畫</button>
    <button class="tab-btn" onclick="switchTab('security')">帳號安全性（修改密碼）</button>
  </div>

  <!-- 分頁 1: 資產配置計畫 (含黃金) -->
  <div id="portfolio" class="tab-content active">
    <div class="card">
      <h2>每月 5 萬元資產分配比率</h2>
      
      <!-- 股票 -->
      <div class="asset-item">
        <div class="asset-header">
          <span>📈 核心股票 (60%)</span>
          <span>NT$ 30,000</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill stock-bg" style="width: 60%;"></div>
        </div>
      </div>

      <!-- 黃金 (新增) -->
      <div class="asset-item">
        <div class="asset-header">
          <span>🥇 避險黃金 (20%)</span>
          <span>NT$ 10,000</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill gold-bg" style="width: 20%;"></div>
        </div>
      </div>

      <!-- 防禦現金 -->
      <div class="asset-item">
        <div class="asset-header">
          <span>💵 防禦現金 / 債券 (20%)</span>
          <span>NT$ 10,000</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill cash-bg" style="width: 20%;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 分頁 2: 密碼修改介面 (新增) -->
  <div id="security" class="tab-content">
    <div class="card">
      <h2>修改登入密碼</h2>
      <form onsubmit="event.preventDefault(); alert('密碼已成功變更！');">
        <div class="form-group">
          <label for="current-password">目前舊密碼</label>
          <input type="password" id="current-password" placeholder="請輸入舊密碼" required>
        </div>
        <div class="form-group">
          <label for="new-password">新密碼</label>
          <input type="password" id="new-password" placeholder="請輸入 8 位數以上新密碼" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">確認新密碼</label>
          <input type="password" id="confirm-password" placeholder="請再次輸入新密碼" required>
        </div>
        <button type="submit" class="btn">更新密碼</button>
      </form>
    </div>
  </div>
</div>

<script>
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }
</script>

</body>
</html>
