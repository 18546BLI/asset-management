<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人資產管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header Zone -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">💰 個人資產管理系統</h1>
        <p class="text-sm text-slate-400 mt-1">跨裝置連動 · 台灣銀行匯率 · 台美股/黃金/基金整合</p>
      </div>
      <div id="auth-section" class="mt-4 md:mt-0">
        <button id="login-btn" onclick="loginGitHub()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium px-5 py-2.5 rounded-xl border border-slate-500 transition flex items-center gap-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          使用 GitHub 跨裝置登入
        </button>
      </div>
    </header>

    <!-- Overview Dashboard -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">總資產 (TWD)</span>
        <div id="total-assets" class="text-3xl font-extrabold text-emerald-400 mt-2">NT$ 0</div>
      </div>
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">美元 / 台幣匯率 (台銀)</span>
        <div id="usd-rate" class="text-3xl font-extrabold text-blue-400 mt-2">32.50</div>
      </div>
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-md">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">本月淨現金流</span>
        <div id="net-cashflow" class="text-3xl font-extrabold text-amber-400 mt-2">+ NT$ 0</div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Asset List (2 Cols) -->
      <div class="lg:col-span-2 bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
          <h2 class="text-xl font-bold text-slate-200">📊 資產清單與約當台幣</h2>
          <button onclick="toggleModal('asset-modal')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition">+ 新增資產</button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="text-xs uppercase bg-slate-700/50 text-slate-400">
              <tr>
                <th class="p-3">資產名稱</th>
                <th class="p-3">類別</th>
                <th class="p-3">持有庫存</th>
                <th class="p-3">最新單價</th>
                <th class="p-3">約當台幣 (TWD)</th>
              </tr>
            </thead>
            <tbody id="asset-table-body" class="divide-y divide-slate-700">
              <tr>
                <td colspan="5" class="text-center p-6 text-slate-500">尚未新增資產或登入...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Quick Transaction / Cashflow Entry (1 Col) -->
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
        <h2 class="text-xl font-bold text-slate-200 border-b border-slate-700 pb-4">💳 快速收支與變現登記</h2>
        <form id="tx-form" onsubmit="handleTransaction(event)" class="space-y-4 text-sm">
          <div>
            <label class="block text-slate-400 mb-1">交易類型</label>
            <select id="tx-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200">
              <option value="income">💵 收入 (Income)</option>
              <option value="expense">💸 支出 (Expense)</option>
              <option value="realize">🔄 資產賣出變現 (Realize)</option>
              <option value="buy">📈 買入新資產 (Buy)</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">項目分類 / 說明</label>
            <input type="text" id="tx-category" placeholder="例：薪資、午餐、台積電變現" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">金額 (TWD)</label>
            <input type="number" id="tx-amount" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200" required>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition">確認送出並連動資產</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Supabase 邏輯前端寫法示意
    function toggleModal(id) {
      alert("請將代碼佈署並完成 Supabase 設定後即可體驗完整彈窗新增功能！");
    }
    function loginGitHub() {
      alert("請於 Supabase 設定 GitHub Provider CLIENT_ID 即可啟用！");
    }
    function handleTransaction(e) {
      e.preventDefault();
      alert("收支登記成功，已自動連動更新資產與現金流！");
    }
  </script>
</body>
</html>
